name: AI Valuation CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci || npm install

      - name: 安装 TypeScript
        run: npm install --save-dev typescript

      - name: 编译 TypeScript
        run: npx tsc

      - name: 运行示例
        run: node examples/basic-score.js
